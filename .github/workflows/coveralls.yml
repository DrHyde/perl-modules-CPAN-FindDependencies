# Auto-generated file, see workflow-templates/coveralls.yml
# To rebuild, see rebuild-workflows in https://github.com/DrHyde/meta-perlmodules

on:
  push:
    paths:
      - '.github/workflows/coveralls.yml'
      - '.github/workflows/run-coveralls'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
name: Generate Coveralls report
jobs:
  build:
    if: github.actor != 'dependabot[bot]'
    runs-on: 'ubuntu-latest'
    steps:
      - uses: actions/checkout@v7
      - uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: 5.42
      - name: Run with coverage checking
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          perl -v
          cpanm Devel::Cover::Report::Coveralls
          cpanm ExtUtils::MakeMaker Test::Pod Test::Pod::Coverage
          perl -Mparent -e0 || cpanm parent
          cpanm --installdeps .
          AUTHOR_TESTING=1 cover -ignore Makefile.PL -test -report Coveralls
